spring.application.name=transaction-service
server.port=8091

# Ollama local : modele de generation (le nom doit correspondre a `ollama list`)
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3.1:8b
langchain4j.ollama.chat-model.temperature=0
langchain4j.ollama.chat-model.timeout=PT120S
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

langchain4j.ollama.streaming-chat-model.log-requests=true
langchain4j.ollama.streaming-chat-model.log-responses=true


langchain4j.ollama.streaming-chat-model.base-url=http://localhost:11434
langchain4j.ollama.streaming-chat-model.model-name=llama3.1:8b
langchain4j.ollama.streaming-chat-model.temperature=0
langchain4j.ollama.streaming-chat-model.timeout=PT120S

logging.level.dev.langchain4j=DEBUG
logging.level.ai.djl=OFF

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/agenticRagDb
spring.datasource.username=admin
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=create


